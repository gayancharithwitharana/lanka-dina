appId: com.gayanwitharana.lankadina
name: Day detail saves a note and a reminder
---
- runFlow:
    file: subflows/open-route.yaml
    env:
      ROUTE: day/2026-11-08
- extendedWaitUntil:
    visible: Add note
    timeout: 30000
- tapOn: Add note
- inputText: Light the oil lamps
- tapOn: Save
- assertVisible: Light the oil lamps
- tapOn: Set reminder
- extendedWaitUntil:
    visible: Time
    timeout: 10000
- takeScreenshot: reminder-editor
- tapOn: Save
- runFlow: subflows/allow-notifications.yaml
- assertVisible: Reminder set · 8:00.AM
- takeScreenshot: day-note
- tapOn: Reminder set · 8:00.AM
- tapOn: Delete reminder
- assertVisible: Set reminder
- tapOn: Edit note
- eraseText: 40
- tapOn: Save
- assertVisible: No note yet
- runFlow: subflows/assert-no-errors.yaml

appId: com.gayanwitharana.lankadina
---
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: "lankadina://settings"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-settings
- tapOn:
    point: 15%,94%
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-calendar
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: "lankadina://upcoming"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-upcoming
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: "lankadina://nakath?view=avurudu"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-nakath-avurudu
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: "lankadina://nakath?view=today"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-nakath-today
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: "lankadina://reminders"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-reminders
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: "lankadina://day/2026-12-23"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-day-poya
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: "lankadina://day/2026-11-24"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-day-maru
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: "lankadina://nakath-share"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-nakath-share
- tapOn: ${CLOSE}
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: "lankadina://lagna"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-lagna
- tapOn: ${CLOSE}
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: "lankadina://reminder/2026-12-23"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-reminder-editor
- tapOn: ${SAVE}
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: "lankadina://day/2026-12-23"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-day-reminder-set
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: "lankadina://reminder/2026-12-23"
- waitForAnimationToEnd
- tapOn: ${DELETE}
- waitForAnimationToEnd
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: "lankadina://note/2026-12-23"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-note-editor
- tapOn: ${CANCEL}

appId: com.gayanwitharana.lankadina
name: Screenshots every screen in one language for translation review
---
- runFlow:
    file: ../subflows/open-route.yaml
    env:
      ROUTE: settings
- extendedWaitUntil:
    visible: English
    timeout: 30000
- tapOn: ${LANGUAGE}
- tapOn: ${LIGHT}
- runFlow:
    file: screenshot-all.yaml
    env:
      PREFIX: ${PREFIX}-light
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: "lankadina://settings"
- tapOn: ${DARK}
- runFlow:
    file: screenshot-all.yaml
    env:
      PREFIX: ${PREFIX}-dark
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: "lankadina://settings"
- tapOn: ${SYSTEM}
- tapOn: English
- extendedWaitUntil:
    visible: Appearance
    timeout: 10000
- runFlow: ../subflows/assert-no-errors.yaml

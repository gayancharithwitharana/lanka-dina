appId: com.gayanwitharana.lankadina
---
- stopApp
- runFlow:
    file: open-link.yaml
    env:
      LINK: "exp+lankadina://?__expo_url=http%3A%2F%2F127.0.0.1%3A8081&__expo_disable_fab=1&__expo_disable_auto_launch=1&__expo_disable_onboarding=1"
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- runFlow: allow-notifications.yaml
- extendedWaitUntil:
    visible: Calendar|දින දර්ශනය|நாட்காட்டி|Our app wants to stay free for you
    timeout: 60000
- waitForAnimationToEnd
- runFlow: allow-ads-consent.yaml
- extendedWaitUntil:
    visible: Calendar|දින දර්ශනය|நாட்காட்டி
    timeout: 60000
- runFlow:
    file: open-link.yaml
    env:
      LINK: "lankadina://settings"
- tapOn: English
- tapOn: Calendar
- runFlow:
    file: open-link.yaml
    env:
      LINK: "lankadina://${ROUTE}"

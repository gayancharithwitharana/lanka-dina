appId: com.gayanwitharana.lankadina
name: Upcoming filters by holiday type
---
- runFlow:
    file: subflows/open-route.yaml
    env:
      ROUTE: upcoming
- extendedWaitUntil:
    visible: Holidays
    timeout: 30000
- tapOn: Poya
- assertNotVisible: Christmas Day
- takeScreenshot: upcoming-poya
- tapOn: All
- runFlow: subflows/assert-no-errors.yaml

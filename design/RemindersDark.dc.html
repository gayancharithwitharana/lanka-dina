<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lankadina reminders (dark)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
a{color:#60A5FA;text-decoration:none}a:hover{color:#93C5FD}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0F1115; color: #F3F4F6; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <header style="padding: 28px 20px 12px 20px; display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Reminders</h1>
    <button aria-label="New reminder" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #F3F4F6; color: #0F1115; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </header>

  <section style="padding: 8px 20px 0 20px; display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 8px 0 2px 0; font-size: 13px; font-weight: 600; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.06em">Automatic</h2>
    <sc-for list="{{auto}}" as="r" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid #2A2F3A; border-radius: 14px">
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
          <span style="font-size: 15px; font-weight: 600">{{r.title}}</span>
          <span style="font-size: 13px; color: #C4C9D4">{{r.sub}}</span>
        </div>
        <button aria-label="{{r.title}}" aria-pressed="{{r.pressed}}" onClick="{{r.toggle}}" style="{{r.track}}">
          <span style="{{r.knob}}" aria-hidden="true"></span>
        </button>
      </div>
    </sc-for>
  </section>

  <section style="padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 8px 0 2px 0; font-size: 13px; font-weight: 600; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.06em">Scheduled</h2>
    <sc-for list="{{scheduled}}" as="s" hint-placeholder-count="2">
      <a href="DayDark.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid #2A2F3A; border-radius: 14px; color: #F3F4F6">
        <span style="{{s.iconStyle}}" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        </span>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
          <span style="font-size: 15px; font-weight: 600">{{s.title}}</span>
          <span style="font-size: 13px; color: #C4C9D4">{{s.when}}</span>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B93A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
    </sc-for>
  </section>

  <div style="flex-grow: 1"></div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #2A2F3A; padding: 6px 8px 22px 8px; background: #0F1115">
    <a href="MainDark.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; min-height: 44px; font-size: 11px; font-weight: 500; color: #9CA3AF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      Calendar
    </a>
    <a href="UpcomingDark.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; min-height: 44px; font-size: 11px; font-weight: 500; color: #9CA3AF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></svg>
      Upcoming
    </a>
    <a href="NakathDark.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; min-height: 44px; font-size: 11px; font-weight: 500; color: #9CA3AF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path><path d="M19 17v4M17 19h4"></path></svg>
      Nakath
    </a>
    <a href="RemindersDark.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; min-height: 44px; font-size: 11px; font-weight: 600; color: #60A5FA">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      Reminders
    </a>
    <a href="SettingsDark.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; min-height: 44px; font-size: 11px; font-weight: 500; color: #9CA3AF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>
      Settings
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { poya: true, longWeekend: false };
  }
  renderVals() {
    const sw = (key, title, sub) => {
      const on = this.state[key];
      return {
        title, sub,
        pressed: on ? 'true' : 'false',
        toggle: () => this.setState({ [key]: !on }),
        track: 'flex-shrink: 0; width: 52px; height: 32px; border-radius: 16px; border: none; padding: 3px; cursor: pointer; display: flex; align-items: center; justify-content: ' + (on ? 'flex-end' : 'flex-start') + '; background: ' + (on ? '#60A5FA' : '#3A404C'),
        knob: 'width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.2)'
      };
    };
    const auto = [
      sw('poya', 'Every Poya day', 'Evening before, 7:00 PM'),
      sw('longWeekend', 'Long weekends', '2 weeks ahead, 9:00 AM')
    ];
    const iconBase = 'flex-shrink: 0; width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; ';
    const scheduled = [
      { title: 'Deepavali', when: 'Sat, Nov 7 · 6:00 PM', iconStyle: iconBase + 'background: #172554; color: #60A5FA' },
      { title: 'Il Full Moon Poya', when: 'Mon, Nov 23 · 7:00 PM', iconStyle: iconBase + 'background: #3A2A0A; color: #F59E0B' }
    ];
    return { auto, scheduled };
  }
}
</script>
</body>
</html>

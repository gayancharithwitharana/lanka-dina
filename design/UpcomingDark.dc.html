<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lankadina upcoming holidays (dark)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
a{color:#60A5FA;text-decoration:none}a:hover{color:#93C5FD}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0F1115; color: #F3F4F6; font-family: Inter, system-ui, sans-serif; overflow: hidden">
  <header style="padding: 28px 20px 12px 20px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Upcoming</h1>
    <div role="group" aria-label="Filter" style="display: flex; gap: 8px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
        <button aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="display: flex; flex-direction: column; padding: 4px 20px 0 20px; gap: 8px; flex-grow: 1; overflow: hidden">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
      <sc-if value="{{it.header}}" hint-placeholder-val="{{ false }}">
        <h2 style="margin: 10px 0 2px 0; font-size: 13px; font-weight: 600; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.06em">{{it.month}}</h2>
      </sc-if>
      <a href="DayDark.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid #2A2F3A; border-radius: 14px; color: #F3F4F6">
        <div style="width: 44px; display: flex; flex-direction: column; align-items: center">
          <span style="font-size: 11px; font-weight: 600; color: #9CA3AF">{{it.dow}}</span>
          <span style="font-size: 20px; font-weight: 700">{{it.day}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
          <span style="font-size: 15px; font-weight: 600">{{it.name}}</span>
          <span style="font-size: 13px; color: #C4C9D4">{{it.kind}}</span>
        </div>
        <span style="{{it.countStyle}}">{{it.count}}</span>
      </a>
    </sc-for>
  </div>

  <div style="display: flex; justify-content: center; padding: 8px 0; background: #171A21; border-top: 1px solid #2A2F3A">
    <div style="width: 320px; height: 50px; border: 1px dashed #8B93A1; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #9CA3AF">AdMob banner · 320×50</div>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #2A2F3A; padding: 6px 8px 22px 8px; background: #0F1115">
    <a href="MainDark.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; min-height: 44px; font-size: 11px; font-weight: 500; color: #9CA3AF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      Calendar
    </a>
    <a href="UpcomingDark.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; min-height: 44px; font-size: 11px; font-weight: 600; color: #60A5FA">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></svg>
      Upcoming
    </a>
    <a href="NakathDark.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; min-height: 44px; font-size: 11px; font-weight: 500; color: #9CA3AF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path><path d="M19 17v4M17 19h4"></path></svg>
      Nakath
    </a>
    <a href="RemindersDark.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; min-height: 44px; font-size: 11px; font-weight: 500; color: #9CA3AF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      Reminders
    </a>
    <a href="SettingsDark.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; min-height: 44px; font-size: 11px; font-weight: 500; color: #9CA3AF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>
      Settings
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const filter = this.state.filter;
    const all = [
      { month: 'November', dow: 'SUN', day: '8', name: 'Deepavali', kind: 'Public · Bank', type: 'public', days: 2 },
      { month: 'November', dow: 'TUE', day: '24', name: 'Il Full Moon Poya', kind: 'Public · Bank · Mercantile', type: 'poya', days: 18 },
      { month: 'December', dow: 'WED', day: '23', name: 'Unduvap Full Moon Poya', kind: 'Public · Bank · Mercantile', type: 'poya', days: 47 },
      { month: 'December', dow: 'FRI', day: '25', name: 'Christmas Day', kind: 'Public · Bank · Mercantile', type: 'public', days: 49 },
      { month: 'January 2027', dow: 'THU', day: '14', name: 'Tamil Thai Pongal Day', kind: 'Public · Bank · Mercantile', type: 'public', days: 69 },
      { month: 'January 2027', dow: 'FRI', day: '22', name: 'Duruthu Full Moon Poya', kind: 'Public · Bank · Mercantile', type: 'poya', days: 77 }
    ];
    const shown = all.filter((x) => filter === 'all' || x.type === filter);
    let last = '';
    const items = shown.map((x) => {
      const header = x.month !== last;
      last = x.month;
      const color = x.type === 'poya' ? '#F59E0B' : '#60A5FA';
      return {
        ...x,
        header,
        count: x.days === 1 ? 'Tomorrow' : 'In ' + x.days + ' days',
        countStyle: 'font-size: 12px; font-weight: 600; white-space: nowrap; color: ' + color
      };
    });
    const defs = [['all', 'All'], ['poya', 'Poya'], ['public', 'Holidays']];
    const filters = defs.map(([id, label]) => {
      const on = id === filter;
      return {
        label,
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ filter: id }),
        style: 'height: 36px; padding: 0 16px; border-radius: 18px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #F3F4F6; color: #0F1115; border: 1px solid #F3F4F6' : 'background: #0F1115; color: #D1D5DB; border: 1px solid #3A404C')
      };
    });
    return { items, filters };
  }
}
</script>
</body>
</html>
